services:
  postgres:
    image: postgres:17
    container_name: academia-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: academia_db
      POSTGRES_USER: academia
      POSTGRES_PASSWORD: academia123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academia -d academia_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: